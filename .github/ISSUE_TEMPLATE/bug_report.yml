name: Bug report
description: Something in laser-line-scan does not work as expected.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please search the existing
        issues first — duplicates slow everyone down.

        **Do not report security vulnerabilities here.** See
        [SECURITY.md](../blob/main/SECURITY.md) and email
        ping.zhao@nidvue.com privately instead.
  - type: dropdown
    id: step
    attributes:
      label: Wizard step
      description: Which part of the pipeline is affected?
      options:
        - "00 — Optics"
        - "01 — Rig"
        - "02 — Calibration"
        - "03 — Object scan"
        - "04 — Dense 3D result"
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Tell us how to reproduce it. Include the dataset or sample you used, if relevant.
      placeholder: |
        1. Open http://localhost:8080
        2. Go to step ...
        3. ...
        4. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: The release or commit SHA you tested.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: "e.g. Chromium 1234 on Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console / worker output
      description: Paste any errors from the browser console or the worker.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: no-data-leaves
    attributes:
      label: Privacy
      options:
        - label: I have removed or anonymised any captured data before attaching it.
          required: true
