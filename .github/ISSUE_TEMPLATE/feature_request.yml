name: Feature request
description: Suggest an idea or improvement for laser-line-scan.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape laser-line-scan. Please describe the problem rather
        than only a solution — it helps us find the right fix.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Optics / spectral design
        - Rig geometry
        - Calibration
        - Object scan / extraction
        - Dense 3D reconstruction / export
        - Performance
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that is currently hard or impossible?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, references, screenshots or sample data.
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This request keeps the runtime dependency-free and browser-only.
          required: true
